name: Build iWORKS official social preview PNG
on:
  push:
    branches:
      - fix/current-iworks-share-preview-20261116
    paths:
      - assets/branding/iworks-social-share.svg
      - .github/workflows/build-iworks-social-share.yml
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: fix/current-iworks-share-preview-20261116
      - name: Render the exact current approved logo into WhatsApp-compatible PNG
        run: |
          python3 -m pip install --disable-pip-version-check cairosvg pillow
          python3 - <<'PY'
          import cairosvg
          from PIL import Image
          src='assets/branding/iworks-social-share.svg'
          out='assets/branding/iworks-social-share.png'
          cairosvg.svg2png(url=src,write_to=out,output_width=1200,output_height=630)
          img=Image.open(out)
          assert img.format=='PNG' and img.size==(1200,630), (img.format,img.size)
          print(f'PASS official iWORKS social preview PNG {img.size}')
          PY
      - name: Commit real PNG asset to feature branch
        run: |
          git add assets/branding/iworks-social-share.png
          if git diff --cached --quiet; then
            echo 'No updated image asset to commit.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'build(share): render approved current iWORKS logo into 1200x630 PNG'
          git push origin HEAD:refs/heads/fix/current-iworks-share-preview-20261116
