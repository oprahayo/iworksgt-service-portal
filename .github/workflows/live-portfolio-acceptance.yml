name: Live Our Work portfolio acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify real production case studies and screenshots
        run: bash scripts/audit_portfolio_live.sh https://iworksgt.com
