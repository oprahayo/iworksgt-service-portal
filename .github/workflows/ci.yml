name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql
          coverage: none

      - name: Lint PHP files
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Validate cPanel deployment scripts
        run: |
          bash -n scripts/deploy_site_polish.sh
          bash -n scripts/deploy_business_photos.sh
          bash -n scripts/deploy_businesshub_home.sh
          bash -n scripts/deploy_clean_home.sh
          bash -n scripts/deploy_clean_public_pages.sh

      - name: Run smoke tests
        run: |
          php tests/crypto_conversion_test.php
          php tests/public_cms_layout_test.php
          php tests/public_services_template_test.php
          php tests/public_about_template_test.php
          php tests/public_photo_config_test.php
          php tests/public_businesshub_home_test.php
          php tests/public_clean_home_test.php
          php tests/public_inner_forms_test.php
          php tests/public_service_detail_clean_test.php
