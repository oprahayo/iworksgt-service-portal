name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
          coverage: none

      - name: Lint PHP files
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Validate cPanel deployment scripts
        run: |
          bash -n scripts/deploy_site_polish.sh
          bash -n scripts/deploy_business_photos.sh
          bash -n scripts/deploy_authentic_photography.sh
          bash -n scripts/deploy_businesshub_home.sh
          bash -n scripts/deploy_clean_home.sh
          bash -n scripts/deploy_clean_public_pages.sh
          bash -n scripts/deploy_service_directory.sh
          bash -n scripts/deploy_interactive_public.sh
          bash -n scripts/deploy_verified_reviews.sh
          bash -n scripts/deploy_public_layout_final.sh
          bash -n scripts/deploy_google_grid_refresh.sh
          bash -n scripts/deploy_mobile_seo_grid.sh
          bash -n scripts/deploy_google_seo_mobile_complete.sh
          bash -n scripts/deploy_public_root_split.sh
          bash -n scripts/deploy_admin_mobile_refresh.sh
          bash tests/deploy_admin_mobile_fixture_test.sh
          bash tests/deploy_split_installer_contract.sh
          bash -n scripts/contain_private_http_access.sh
          bash tests/f01_containment_fixture_test.sh
          bash -n scripts/install_scheduled_jobs.sh
          bash tests/f12_schedule_fixture_test.sh
          bash -n scripts/prepare_private_migration_stage.sh
          bash -n scripts/cpanel_finalize_release.sh
          bash tests/f22_private_migration_stage_fixture_test.sh
          bash -n scripts/audit_public_seo_live.sh
          bash -n scripts/audit_launch_public.sh

      - name: Run smoke tests
        run: |
          php tests/crypto_conversion_test.php
          php tests/public_cms_layout_test.php
          php tests/public_services_template_test.php
          php tests/public_about_template_test.php
          php tests/public_photo_config_test.php
          php tests/authentic_photography_contract_test.php
          php tests/public_businesshub_home_test.php
          php tests/public_clean_home_test.php
          php tests/public_inner_forms_test.php
          php tests/public_service_detail_clean_test.php
          php tests/public_auth_modal_contract_test.php
          php tests/public_assistance_contract_test.php
          php tests/site_launch_blockers_contract_test.php
          php tests/job_review_workflow_test.php
          php tests/public_review_carousel_test.php
          php tests/public_layout_finish_test.php
          php tests/google_oauth_contract_test.php
          php tests/public_seo_mobile_test.php
          php tests/domain_split_contract_test.php
          php tests/order_resume_contract_test.php
          php tests/trademark_pricing_test.php
          php tests/stripe_card_vault_contract_test.php
          php tests/client_workspace_unification_test.php
          php tests/customer_catalogue_unification_test.php
          php tests/cac_registration_choice_ui_test.php
          php tests/cac_guided_render_test.php
          php tests/cac_launch_preparation_test.php
          php tests/cac_unified_product_contract_test.php
          php tests/editorial_launch_contract_test.php
          php tests/blog_journal_render_test.php
          php tests/responsive_brand_logo_contract_test.php
          php tests/iworks_original_favicon_contract_test.php
          php tests/home_insights_three_cards_contract_test.php
          php tests/admin_public_navigation_schema_contract_test.php
          php tests/job_support_refresh_contract_test.php
          php tests/support_reply_email_test.php
          php tests/mail_envelope_sender_test.php
          php tests/f01_mail_metadata_test.php
          php tests/f02_job_file_authorization_test.php
          php tests/f15_gateway_insert_id_test.php
          php tests/f03_f05_auth_session_reset_test.php
          php tests/f07_f08_gateway_validation_test.php
          php tests/f09_payment_atomic_transition_test.php
          php tests/f16_f17_f18_f19_site_remediation_test.php
          php tests/f04_auth_rate_limit_test.php
          php tests/otp_session_recovery_test.php
          php tests/logout_login_csrf_regression_test.php
          php tests/f22_safe_error_response_test.php
          php tests/f06_notification_outbox_test.php
          php tests/f13_cac_quote_consistency_test.php
          php tests/remediation_release_gate_test.php
          php tests/cpanel_finalize_release_contract_test.php
          php tests/f22_controlled_schema_migrations_test.php
          php tests/live_chat_emoji_editorial_contract_test.php

      - name: Validate public interaction JavaScript
        run: |
          node --check assets/js/public-ux.js
          node --check assets/js/public-assistance.js
          node --check assets/js/live-inbox.js
