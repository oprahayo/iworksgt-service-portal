          node --check assets/js/dashboard-live-visitors.js
          node --check assets/js/admin-transition.js
          node tests/admin_transition_behavior_test.js

  academy-database:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: academy_ci_root
          MYSQL_DATABASE: academy_ci
          MYSQL_USER: academy_ci
          MYSQL_PASSWORD: academy_ci_fixture
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_NAME: academy_ci
      DB_USER: academy_ci
      DB_PASS: academy_ci_fixture
      ACADEMY_CI_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql
          coverage: none
      - name: Load isolated baseline and apply migration twice
        run: |
          MYSQL_PWD="$DB_PASS" mysql -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" < database.sql
          php scripts/migrate_academy.php --backup-confirmed
          php scripts/migrate_academy.php --backup-confirmed
          php scripts/migrate_academy_learning.php --backup-confirmed
          php scripts/migrate_academy_learning.php --backup-confirmed
          php scripts/migrate_academy_assessments.php --backup-confirmed
          php scripts/migrate_academy_assessments.php --backup-confirmed
          php scripts/migrate_academy_requests.php --backup-confirmed
          php scripts/migrate_academy_requests.php --backup-confirmed
          php scripts/migrate_academy_timed_exams.php --backup-confirmed
          php scripts/migrate_academy_timed_exams.php --backup-confirmed
          php scripts/migrate_academy_retakes.php --backup-confirmed
          php scripts/migrate_academy_retakes.php --backup-confirmed
          php scripts/migrate_academy_admin_history.php --backup-confirmed
          php scripts/migrate_academy_admin_history.php --backup-confirmed
          php scripts/migrate_academy_assignment_files.php --backup-confirmed
          php scripts/migrate_academy_assignment_files.php --backup-confirmed
          php scripts/migrate_academy_student_deletions.php --backup-confirmed
          php scripts/migrate_academy_student_deletions.php --backup-confirmed
      - name: Verify real database constraints and simulated gateway issuance
        run: php tests/academy_database_integration_test.php

      - name: Verify certification request lifecycle
        run: php tests/academy_requests_integration_test.php
      - name: Render all Academy administration sections using MySQL fixtures
        env:
          ACADEMY_VISUAL_FIXTURES: '1'
        run: |
          for tab in students student enrollments courses certificates requests analytics; do
            php tests/academy_admin_render_test.php "$tab"
          done

      - name: Render independent Academy student screens
        env:
          ACADEMY_VISUAL_FIXTURES: '1'
        run: |
          for screen in dashboard courses certificates profile; do
            php tests/academy_student_render_test.php "$screen"
          done

      - name: Verify learning access and render course builder and learning workspace
        env:
          ACADEMY_VISUAL_FIXTURES: '1'
        run: php tests/academy_learning_integration_test.php
      - name: Verify Digital Marketing course import and idempotency
        run: |
          test "$DB_NAME" = academy_ci
          php scripts/seed_academy_digital_marketing.php "$PWD" --backup-confirmed
          php scripts/seed_academy_digital_marketing.php "$PWD" --backup-confirmed
          php tests/academy_digital_marketing_seed_test.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Academy responsive layouts in Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          node tests/academy_responsive_visual_qa.mjs
      - name: Save synthetic Academy screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-responsive-qa
          path: docs/visual-qa/academy/*.png
          if-no-files-found: ignore

  academy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic preview test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-lato
          python -m pip install 'Pillow==11.3.0' 'reportlab==4.4.4' 'pypdf==6.1.3'
      - name: Test restricted certificate rendering and deployment syntax
        run: |
          bash -n scripts/deploy_academy_sprint7c.sh
          python tests/academy_preview_render_test.py /usr/share/fonts/truetype/lato
          python tests/academy_transcript_render_test.py /usr/share/fonts/truetype/lato
