name: Capture real Gansell public screenshots

on:
  pull_request:
    paths:
      - '.github/workflows/capture-gansell-public.yml'
      - 'scripts/capture_gansell_public.mjs'

permissions:
  contents: write

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Capture real public vendor and marketplace views
        run: node scripts/capture_gansell_public.mjs
      - name: Commit verified captures to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/branding/solutions/*.png
          git diff --cached --quiet && exit 0
          git commit -m "assets(gansell): capture real public home and vendor screenshots"
          git push origin HEAD:"$GITHUB_HEAD_REF"
