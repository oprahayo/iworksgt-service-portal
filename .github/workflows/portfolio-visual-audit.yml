name: Portfolio visual reference audit
on:
  push:
    branches: [ux/ckdigital-inspired-portfolio-20261114]
    paths: [.github/workflows/portfolio-visual-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Capture reference and current site with real browser
        run: |
          mkdir -p portfolio-reference
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          sites = {
            "reference-ckdigital-work": "https://ckdigital.com/work",
            "current-iworks-case-studies": "https://iworksgt.com/case-studies",
          }
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True,args=['--no-sandbox'])
              for name, url in sites.items():
                  page = browser.new_page(viewport={"width": 1440, "height": 900},device_scale_factor=1)
                  try:
                      result=page.goto(url, wait_until="domcontentloaded",timeout=35000)
                      page.wait_for_timeout(1400)
                      page.screenshot(path=f"portfolio-reference/{name}.png",full_page=True,animations="disabled")
                      print(f"{name}: HTTP {result.status if result else 'n/a'}, TITLE {page.title()}")
                  except Exception as e:
                      print(f"{name}: screenshot failed: {str(e)[:160]}")
                  finally:
                      page.close()
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-layout-reference
          path: portfolio-reference/
          retention-days: 7
