name: iWORKS Case Studies visual QA
on:
  push:
    branches: [ux/home-case-study-showcase-carousel-20261115]
    paths:
      - .github/workflows/portfolio-visual-audit.yml
      - tests/fixtures/render_portfolio_preview.php
      - assets/css/portfolio-work.css
      - views/public-case-studies-refined.php
      - views/public-case-study-detail.php
      - app/editorial.php
      - views/public-home-clean.php
      - tests/fixtures/render_home_case_preview.php
      - assets/js/portfolio-work.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Render database-free preview
        run: |
          php tests/fixtures/render_portfolio_preview.php work > portfolio-preview.html
          php tests/fixtures/render_portfolio_preview.php detail > portfolio-detail-preview.html
          php tests/fixtures/render_home_case_preview.php > home-case-preview.html
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/iworks-portfolio-http.log 2>&1 &
          sleep 2
      - name: Capture current site and new desktop/mobile case-study previews
        run: |
          mkdir -p portfolio-reference
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          sites = {
            "current-iworks-case-studies": ("https://iworksgt.com/case-studies", 1440, 900),
            "preview-iworks-work-desktop": ("http://127.0.0.1:8765/portfolio-preview.html", 1440, 900),
            "preview-iworks-work-mobile": ("http://127.0.0.1:8765/portfolio-preview.html", 390, 844),
            "preview-iworks-detail-desktop": ("http://127.0.0.1:8765/portfolio-detail-preview.html", 1440, 900),
            "preview-iworks-home-carousel-desktop": ("http://127.0.0.1:8765/home-case-preview.html", 1440, 900),
            "preview-iworks-home-carousel-mobile": ("http://127.0.0.1:8765/home-case-preview.html", 390, 844),
          }
          failures = []
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True,args=['--no-sandbox'])
              for name, (url, width, height) in sites.items():
                  page = browser.new_page(viewport={"width": width, "height": height},device_scale_factor=1)
                  try:
                      result=page.goto(url, wait_until="domcontentloaded",timeout=35000)
                      page.wait_for_timeout(1200)
                      # full_page screenshots do not always trigger lazy image
                      # loading outside the initial viewport. Force all static
                      # preview images to decode before capturing the gallery.
                      if "preview-iworks-" in name:
                          page.evaluate("""async () => {
                            const imgs = [...document.images];
                            imgs.forEach(img => img.loading='eager');
                            await Promise.all(imgs.map(img => img.decode().catch(() => {})));
                          }""")
                      if "home-carousel" in name:
                          rail = page.locator("[data-iw-showcase-track]")
                          page.locator(".iw-home-case-stories").scroll_into_view_if_needed()
                          page.wait_for_timeout(450)
                          stats = rail.evaluate("""el => ({
                            total: el.scrollWidth, width: el.clientWidth,
                            count: el.querySelectorAll('[data-iw-showcase-slide]').length
                          })""")
                          if stats["count"] != 5 or stats["total"] <= stats["width"]:
                              raise RuntimeError(f"Case carousel is not showing all five as a scrollable rail: {stats}")
                          if "desktop" in name:
                              page.locator("[data-iw-showcase-next]").click()
                              page.wait_for_timeout(600)
                              after_next=rail.evaluate("el=>el.scrollLeft")
                              if after_next < 30:
                                  raise RuntimeError("Next button failed to scroll")
                              page.locator("[data-iw-showcase-prev]").click()
                              page.wait_for_timeout(600)
                              before_drag=rail.evaluate("el=>el.scrollLeft")
                              box=rail.bounding_box()
                              y=box["y"]+box["height"]*.35
                              page.mouse.move(box["x"]+box["width"]*.7,y)
                              page.mouse.down()
                              page.mouse.move(box["x"]+box["width"]*.34,y,steps=9)
                              page.mouse.up()
                              page.wait_for_timeout(300)
                              after_drag=rail.evaluate("el=>el.scrollLeft")
                              if after_drag <= before_drag+30:
                                  raise RuntimeError(f"Mouse drag failed: before={before_drag}, after={after_drag}")
                              page.locator(".iw-home-case-visual").first.hover()
                              page.wait_for_timeout(360)
                              overlay_opacity=page.locator(".iw-home-case-overlay").first.evaluate(
                                  "el=>parseFloat(getComputedStyle(el).opacity)"
                              )
                              if overlay_opacity < .9:
                                  raise RuntimeError(f"Fade overlay did not appear: {overlay_opacity}")
                              print(f"{name}: next, previous, mouse drag and fade overlay passed")
                          else:
                              # Native overflow provides touch-swiping without
                              # affecting vertical document scrolling.
                              move=rail.evaluate("""el => {
                                el.style.scrollBehavior='auto';
                                el.style.scrollSnapType='none';
                                el.scrollLeft=240;
                                return el.scrollLeft;
                              }""")
                              if move < 60:
                                  raise RuntimeError("Mobile horizontal scrolling failed")
                              print(f"{name}: 5 slides and mobile horizontal overflow passed")
                          rail.evaluate("el=>el.scrollLeft=0")
                          page.wait_for_timeout(520)
                      if "preview-iworks-" in name:
                          # Scroll through the full page as a visitor would,
                          # so all intersection-based entries become visible.
                          # Then verify no hidden content and no mobile overflow.
                          page.evaluate("""async () => {
                            const total = document.documentElement.scrollHeight;
                            const increment = Math.max(250, window.innerHeight * .7);
                            for (let y=0; y<=total; y+=increment) {
                              window.scrollTo(0,y);
                              await new Promise(r => setTimeout(r,110));
                            }
                            window.scrollTo(0,0);
                            await new Promise(r => setTimeout(r,720));
                          }""")
                          hidden = page.evaluate("""() => [...document.querySelectorAll('[data-iw-reveal]')]
                            .filter(el => !el.classList.contains('is-visible')
                                      && getComputedStyle(el).opacity === '0').length""")
                          overflow = page.evaluate(
                            "() => document.documentElement.scrollWidth - window.innerWidth"
                          )
                          if hidden:
                              raise RuntimeError(f"{hidden} case-study entries remained invisible after scroll")
                          if overflow > 3:
                              raise RuntimeError(f"Horizontal overflow {overflow}px at width {width}")
                          print(f"{name}: scroll effects verified; horizontal overflow={overflow}px")
                      page.screenshot(path=f"portfolio-reference/{name}.png",full_page=True,animations="disabled")
                      print(f"{name}: HTTP {result.status if result else 'n/a'}, TITLE {page.title()}")
                  except Exception as e:
                      failures.append(f"{name}: {e}")
                      print(f"{name}: screenshot failed: {str(e)[:240]}")
                  finally:
                      page.close()
              browser.close()
          if failures:
              raise RuntimeError("Visual QA failed: " + "; ".join(failures))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-layout-reference
          path: portfolio-reference/
          retention-days: 7
