<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" role="img" aria-labelledby="title desc">
<title id="title">SCUML document preview — illustration only</title>
<desc id="desc">A sample document layout with masked business details and a large NOT AN OFFICIAL CERTIFICATE watermark. It is not a certificate issued by the EFCC.</desc>
<rect width="900" height="635" rx="23" fill="#faf8f3"/>
<rect x="50" y="44" width="800" height="547" rx="9" fill="#ffffff" stroke="#dfe7df" stroke-width="2"/>
<rect x="71" y="65" width="758" height="505" rx="2" fill="none" stroke="#2a785b" stroke-width="9"/>
<rect x="83" y="77" width="734" height="481" rx="0" fill="none" stroke="#e4ede4" stroke-width="2"/>
<text x="450" y="128" font-family="Inter,Arial,sans-serif" font-size="13" letter-spacing="5" text-anchor="middle" fill="#4c7563" font-weight="700">DOCUMENT EXAMPLE</text>
<text x="450" y="183" font-family="Inter,Arial,sans-serif" font-size="36" text-anchor="middle" fill="#202c33" font-weight="800">SCUML Registration</text>
<text x="450" y="215" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle" fill="#66736c">Special Control Unit Against Money Laundering</text>
<path d="M135 247 H765" stroke="#cadad0" stroke-width="2"/>
<text x="140" y="298" font-family="Inter,Arial,sans-serif" font-size="18" fill="#44524a" font-weight="600">Business</text>
<rect x="320" y="274" width="395" height="26" rx="3" fill="#a4ada7"/>
<text x="140" y="354" font-family="Inter,Arial,sans-serif" font-size="18" fill="#44524a" font-weight="600">Registration</text>
<rect x="320" y="331" width="275" height="26" rx="3" fill="#a4ada7"/>
<text x="140" y="410" font-family="Inter,Arial,sans-serif" font-size="18" fill="#44524a" font-weight="600">Business sector</text>
<rect x="320" y="386" width="322" height="26" rx="3" fill="#a4ada7"/>
<text x="450" y="477" font-family="Inter,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#67716c">All details intentionally masked</text>
<g transform="translate(450,355) rotate(-18)">
<rect x="-390" y="-52" width="780" height="104" fill="#fff" opacity=".85"/>
<text text-anchor="middle" y="13" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="900" letter-spacing="1" fill="#a74720" opacity=".88">NOT AN OFFICIAL CERTIFICATE</text>
</g>
<rect x="195" y="525" width="510" height="30" rx="3" fill="#eaf4eb"/>
<text x="450" y="546" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="750" fill="#275b43">ILLUSTRATION FOR SERVICE EXPLANATION ONLY</text>
</svg>