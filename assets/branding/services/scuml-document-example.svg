<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 770" role="img" aria-labelledby="title desc">
<title id="title">SCUML certificate format — redacted sample illustration, not valid</title>
<desc id="desc">Inspired by the layout of a supplied genuine SCUML certificate. Green ornamented frame, parchment background and red registration heading. All identifiers, barcodes, QR codes and signatures are omitted. This is not an issued certificate.</desc>
<defs>
  <pattern id="security" width="26" height="24" patternUnits="userSpaceOnUse">
    <rect width="26" height="24" fill="#17794a"/>
    <path d="M0 12L13 0l13 12L13 24Z M0 0l26 24M26 0L0 24" fill="none" stroke="#afe0b2" stroke-width="1.1"/>
    <circle cx="13" cy="12" r="5" stroke="#d4f1cd" stroke-width="1" fill="none"/>
    <path d="M13 6v12m-6-6h12" stroke="#8bcba0" stroke-width="1"/>
  </pattern>
  <pattern id="paper" width="53" height="46" patternUnits="userSpaceOnUse">
    <rect width="53" height="46" fill="#fff8df"/>
    <path d="M0 24h53M24 0v46" stroke="#dbd1a9" opacity=".16" stroke-width="1"/>
    <circle cx="28" cy="25" r="13" fill="none" stroke="#f0e6bb" opacity=".36"/>
  </pattern>
</defs>
<rect width="1100" height="770" rx="5" fill="url(#security)"/>
<rect x="38" y="37" width="1024" height="697" fill="#fffdf4" stroke="#e5d8a3" stroke-width="3"/>
<rect x="52" y="50" width="996" height="670" fill="url(#paper)" stroke="#12794a" stroke-width="2"/>
<path d="M82 84H1018M82 684H1018" stroke="#d9cb98" stroke-width="1.5"/>
<text x="550" y="115" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="18" font-weight="700" fill="#1f2b24" letter-spacing=".75">SPECIAL CONTROL UNIT AGAINST MONEY LAUNDERING</text>
<text x="550" y="149" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="23" font-weight="700" fill="#1f2b24">(SCUML)</text>
<path d="M355 170H745" stroke="#d4c9a2" stroke-width="2"/>
<text x="550" y="230" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="43" fill="#a72e25" font-weight="700">Certificate of Registration</text>
<text x="550" y="274" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="25" font-style="italic" fill="#4e4940">I hereby certify that</text>
<rect x="302" y="298" width="496" height="36" rx="1" fill="#23282a"/>
<text x="550" y="377" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#514c45">Registration record and business information</text>
<rect x="245" y="397" width="610" height="23" rx="2" fill="#23282a"/>
<rect x="348" y="432" width="404" height="23" rx="2" fill="#23282a"/>
<g transform="translate(550,510) rotate(-13)">
  <rect x="-432" y="-51" width="864" height="100" rx="2" fill="#fff8df" opacity=".94"/>
  <text text-anchor="middle" y="4" font-family="Arial,Helvetica,sans-serif" font-size="50" fill="#c05633" font-weight="900" letter-spacing="2">SAMPLE · NOT VALID</text>
  <text text-anchor="middle" y="35" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#965c49" font-weight="800" letter-spacing="1.6">NOT AN OFFICIAL CERTIFICATE</text>
</g>
<text x="550" y="608" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#64625a">Registration number, QR code, barcode, seal, signature and dates intentionally omitted</text>
<rect x="280" y="638" width="540" height="31" fill="#fff3e7" stroke="#cc8362" stroke-width="1"/>
<text x="550" y="660" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#98512c">ILLUSTRATION FOR SERVICE EXPLANATION ONLY</text>
</svg>